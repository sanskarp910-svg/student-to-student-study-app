    // Helper: Star Rating Display
    function StarRatingDisplay({ rating, count, size = "sm" }) {
      const fullStars = Math.floor(rating);
      const hasHalf = rating % 1 >= 0.4;
      const starSize = size === "lg" ? "w-5 h-5" : size === "md" ? "w-4 h-4" : "w-3.5 h-3.5";

      return (
        <div className="flex items-center gap-1">
          <div className="flex items-center text-orange-500">
            {[1, 2, 3, 4, 5].map((star) => (
              <svg 
                key={star} 
                className={`${starSize} ${star <= fullStars ? 'fill-current text-orange-500' : (star === fullStars + 1 && hasHalf ? 'fill-orange-200 text-orange-500' : 'text-cream-300 fill-cream-200')}`} 
                viewBox="0 0 20 20"
              >
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
            ))}
          </div>
          <span className="font-semibold text-xs text-navy-800 ml-0.5">{rating.toFixed(1)}</span>
          {count !== undefined && (
            <span className="text-navy-500 text-xs">({count})</span>
          )}
        </div>
      );
    }

      // Handler: Post new doubt
      const handlePostDoubt = (newDoubtData) => {
        const newDoubt = {
          id: `dbt-${Date.now()}`,
          title: newDoubtData.title,
          questionText: newDoubtData.questionText,
          codeSnippet: newDoubtData.codeSnippet || '',
          subject: newDoubtData.subject,

          authorUid: user.uid,
          authorCollege: user.college,
          createdAt: "Just now",
          views: 1,
          bestAnswerFlag: false,
          answers: []

        setUser({ ...user, doubtsCount: user.doubtsCount + 1, points: user.points + 10 });

        setCurrentTab('doubts');

                  </div>
                  <button 
                    onClick={() => setShowRatingModal(null)}
                    className="text-navy-400 hover:text-navy-900 text-sm font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-navy-600 mb-4">
                  How helpful was the explanation by <strong>{showRatingModal.targetName}</strong>? Your rating rewards quality university contributors.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const score = parseInt(e.target.score.value) || 5;
                  const feedback = e.target.feedback.value;
                  handleSubmitRating(score, feedback);
                }} className="space-y-4">
                  
                  {/* Interactive Star Picker */}
                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase tracking-wider mb-2">
                      Score (1 to 5 Stars)
                    </label>
                    <select 
                      name="score" 
                      defaultValue="5"
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl px-4 py-2.5 text-sm font-bold text-navy-900 focus:outline-none focus:ring-2 focus:ring-teal-500"
                    >
                      <option value="5">★★★★★ (5 Stars - Exceptional & clear)</option>
                      <option value="4">★★★★☆ (4 Stars - Very helpful)</option>
                      <option value="3">★★★☆☆ (3 Stars - Decent explanation)</option>
                      <option value="2">★★☆☆☆ (2 Stars - Partially helpful)</option>
                      <option value="1">★☆☆☆☆ (1 Star - Needs improvement)</option>
                    </select>
                  </div>

                  {/* Feedback Textarea */}
                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase tracking-wider mb-2">
                      Feedback Note (Optional)
                    </label>
                    <textarea 
                      name="feedback"
                      rows="3"
                      placeholder="e.g. Great explanation of memory allocation and index limits!"
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 text-xs text-navy-900 focus:outline-none focus:ring-2 focus:ring-teal-500"
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button 
                      type="button"
                      onClick={() => setShowRatingModal(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-navy-700 hover:bg-cream-200"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition"
                    >
                      Submit Rating
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CREATE STUDY GROUP */}
          {showCreateGroupModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-cream-100 rounded-2xl max-w-lg w-full p-6 border border-cream-300 shadow-elevated max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-extrabold text-navy-900 text-lg">Create Course Study Group</h3>
                  <button onClick={() => setShowCreateGroupModal(false)} className="text-navy-400 hover:text-navy-900 text-sm font-bold">
                    ✕
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  handleCreateGroup({
                    name: f.groupName.value,
                    subject: f.subject.value,
                    semester: f.semester.value,
                    schedule: f.schedule.value,
                    maxMembers: f.maxMembers.value,
                    description: f.description.value
                  });
                }} className="space-y-4">
                  
                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Group Name *</label>
                    <input 
                      type="text" 
                      name="groupName" 
                      required 
                      placeholder="e.g. Maths Unit 3 Numerical Methods Drill" 
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900 focus:outline-none focus:ring-2 focus:ring-teal-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Subject</label>
                      <select name="subject" className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900">
                        {SUBJECTS.filter(s => s !== "All Subjects").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Semester</label>
                      <select name="semester" className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900">
                        {SEMESTERS.filter(s => s !== "All Semesters").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Schedule & Location / Link</label>
                    <input 
                      type="text" 
                      name="schedule" 
                      defaultValue="Wednesdays 6:00 PM • Library Room 201"
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Max Peers</label>
                    <input 
                      type="number" 
                      name="maxMembers" 
                      defaultValue="40" 
                      min="5" 
                      max="150"
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Group Goal / Description</label>
                    <textarea 
                      name="description" 
                      rows="3" 
                      required
                      placeholder="Describe what your group will study and collaborate on..." 
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 text-xs text-navy-900"
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowCreateGroupModal(false)} className="px-4 py-2 rounded-xl text-xs font-semibold text-navy-700">
                      Cancel
                    </button>
                    <button type="submit" className="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl">
                      Launch Group
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: UPLOAD NOTES */}
          {showUploadNoteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-cream-100 rounded-2xl max-w-lg w-full p-6 border border-cream-300 shadow-elevated">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-extrabold text-navy-900 text-lg">Upload Notes to Library</h3>
                  <button onClick={() => setShowUploadNoteModal(false)} className="text-navy-400 hover:text-navy-900 text-sm font-bold">
                    ✕
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const f = e.target;
                  handleUploadNote({
                    title: f.title.value,
                    subject: f.subject.value,
                    semester: f.semester.value,
                    description: f.description.value
                  });
                }} className="space-y-4">
                  
                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Notes Title (Unit & Subject) *</label>
                    <input 
                      type="text" 
                      name="title" 
                      required 
                      placeholder="e.g. Maths Unit 2: Laplace Transforms & Differential Eq" 
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Subject</label>
                      <select name="subject" className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900">
                        {SUBJECTS.filter(s => s !== "All Subjects").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Semester</label>
                      <select name="semester" className="w-full bg-cream-50 border border-cream-300 rounded-xl px-3 py-2 text-xs text-navy-900">
                        {SEMESTERS.filter(s => s !== "All Semesters").map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Attach File (Simulated)</label>
                    <div className="border-2 border-dashed border-cream-300 rounded-xl p-4 text-center bg-cream-50 text-xs text-navy-600">
                      📄 Click to attach PDF / Handwritten Scans (Max 25 MB)
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-navy-800 uppercase mb-1">Summary Description</label>
                    <textarea 
                      name="description" 
                      rows="2" 
                      placeholder="Summarize key derivations, formulas, or past exam solved papers included..."
                      className="w-full bg-cream-50 border border-cream-300 rounded-xl p-3 text-xs text-navy-900"
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowUploadNoteModal(false)} className="px-4 py-2 rounded-xl text-xs font-semibold text-navy-700">
                      Cancel
                    </button>
                    <button type="submit" className="bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md">
                      Share with Campus
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: PREVIEW NOTES */}
          {previewNote && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-cream-100 rounded-2xl max-w-xl w-full p-6 border border-cream-300 shadow-elevated">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 bg-navy-800 text-cream-50 text-xs font-bold rounded-md">{previewNote.subject}</span>
                    <span className="text-xs text-navy-500 font-semibold">{previewNote.semester}</span>
                  </div>
                  <button onClick={() => setPreviewNote(null)} className="text-navy-400 hover:text-navy-900 text-sm font-bold">
                    ✕
                  </button>
                </div>

                <h3 className="font-extrabold text-navy-900 text-lg leading-snug">{previewNote.title}</h3>
                <p className="text-xs text-navy-600 mt-2">{previewNote.description}</p>

                {/* Simulated Document Preview Page */}
                <div className="my-4 bg-white border border-cream-300 rounded-xl p-6 shadow-inner text-navy-800 font-serif text-xs space-y-2.5">
                  <div className="border-b border-gray-200 pb-2 mb-2 flex justify-between font-sans text-[10px] text-gray-500">
                    <span>UNIT NOTE PREVIEW • PAGE 1 OF {previewNote.pages}</span>
                    <span>Uploader: {previewNote.uploaderName}</span>
                  </div>
                  <h4 className="font-sans font-bold text-sm text-navy-900">{previewNote.title}</h4>
                  <p>1. Fundamental Definitions & Theorems applicable to {previewNote.subject}.</p>
                  <p>2. Detailed derivation of standard equations and boundary conditions.</p>
                  <p>3. Solved examples from previous year university exam papers (2020-2025).</p>
                  <div className="p-3 bg-amber-50 border border-amber-200 rounded text-amber-900 font-mono text-[11px]">
                    [Formulas, circuit graphs, or code traces rendered in complete PDF]
                  </div>
                </div>

                <div className="flex items-center justify-between pt-2">
                  <span className="text-xs text-navy-500 font-mono">{previewNote.fileSize} • {previewNote.downloads} peers downloaded</span>
                  <button 
                    onClick={() => {
                      showNotification(`Downloading "${previewNote.title}"...`);
                      setPreviewNote(null);
                    }}
                    className="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow transition"
                  >
                    Download Full PDF ↓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: USER PROFILE & STATS */}
          {showProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/70 backdrop-blur-sm animate-fadeIn">
              <div className="bg-cream-100 rounded-2xl max-w-md w-full p-6 border border-cream-300 shadow-elevated">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-extrabold text-navy-900 text-lg">Student Profile</h3>
                  <button onClick={() => setShowProfileModal(false)} className="text-navy-400 hover:text-navy-900 text-sm font-bold">
                    ✕
                  </button>
                </div>

                <div className="flex items-center gap-4 mb-4">
                  <img src={user.avatar} alt={user.name} className="w-14 h-14 rounded-2xl object-cover ring-2 ring-teal-500" />
                  <div>
                    <h4 className="font-extrabold text-navy-900 text-base">{user.name}</h4>
                    <p className="text-xs text-teal-700 font-mono font-bold">{user.uid}</p>
                    <p className="text-[11px] text-navy-500">{user.college}</p>
                  </div>
                </div>

                <div className="bg-cream-50 p-3.5 rounded-xl border border-cream-200 space-y-1.5 text-xs text-navy-700 mb-4">
                  <p><strong>Course:</strong> {user.course}</p>
                  <p><strong>Current Level:</strong> {user.semester}</p>
                  <p><strong>Enrolled Subjects:</strong> {user.subjects.join(", ")}</p>
                </div>

                <div className="grid grid-cols-3 gap-2 text-center mb-4">
                  <div className="bg-navy-900 text-cream-50 p-2.5 rounded-xl">
                    <span className="block font-bold text-teal-400 text-base">{user.doubtsCount}</span>
                    <span className="text-[10px] text-cream-300">Doubts Asked</span>
                  </div>
                  <div className="bg-navy-900 text-cream-50 p-2.5 rounded-xl">
                    <span className="block font-bold text-orange-400 text-base">{user.answersCount}</span>
                    <span className="text-[10px] text-cream-300">Answers Given</span>
                  </div>
                  <div className="bg-navy-900 text-cream-50 p-2.5 rounded-xl">
                    <span className="block font-bold text-teal-300 text-base">{user.points}</span>
                    <span className="text-[10px] text-cream-300">Peer Points</span>
                  </div>
                </div>

                <button 
                  onClick={() => setShowProfileModal(false)}
                  className="w-full bg-navy-800 hover:bg-navy-900 text-cream-50 font-bold text-xs py-2.5 rounded-xl transition"
                >
                  Close Profile
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-navy-950 text-cream-300 border-t border-navy-800 py-8 px-4 text-center text-xs space-y-2 mt-auto">
            <div className="flex items-center justify-center gap-2 font-bold text-cream-100 text-sm">
              <span className="text-teal-400">Student to Student Study App</span>
              <span>•</span>
              <span className="text-orange-400">Peer Learning Network</span>
            </div>
            <p className="text-navy-400 max-w-md mx-auto">
              Connecting university engineering students for collaborative doubts solving, verified course notes sharing, and peer mentoring.
            </p>
            <p className="text-[11px] text-navy-500 pt-2">
              Designed with Navy Blue, Cream, Teal, and Orange • Fully responsive mobile-friendly layout
            </p>
          </footer>

        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
